<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-dark: #1B4332;
      --emerald-medium: #2D6A4F;
      --emerald-accent: #40916C;
      --emerald-mint: #52B788;
      --sage-soft: #95D5B2;
      --sage-pastel: #D8F3DC;
      --forest-bg: #F7FBF9;
      --card-white: #FFFFFF;
      --slate-dark: #1E293B;
      --slate-medium: #475569;
      --slate-light: #64748B;
      --slate-border: #E2E8F0;
      --slate-hover: #F1F5F9;
      --flame: #FF6B35;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --shadow-soft: 0 4px 20px -2px rgba(27, 67, 50, 0.08);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--forest-bg); color: var(--slate-dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 14px 40px; }
    .app-shell { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--emerald-dark), var(--emerald-medium)); display: flex; align-items: center; justify-content: center; color: var(--sage-soft); box-shadow: 0 4px 12px rgba(27, 67, 50, 0.2); }
    .brand-title h1 { font-size: 20px; font-weight: 800; color: var(--emerald-dark); line-height: 1.1; }
    .brand-title p { font-size: 12px; color: var(--slate-light); font-weight: 500; }
    .progress-hero { background: linear-gradient(135deg, var(--emerald-dark) 0%, #225740 100%); border-radius: var(--radius-xl); padding: 22px; color: white; box-shadow: var(--shadow-soft); }
    .progress-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .progress-sub { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--sage-soft); margin-bottom: 4px; }
    .progress-status { font-size: 18px; font-weight: 700; }
    .progress-bar-track { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.2); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sage-soft), #B7E4C7); border-radius: 5px; transition: width 0.5s ease; }
    .progress-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sage-pastel); }
    .date-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; }
    .date-pill { flex: 1; min-width: 50px; background: var(--card-white); border: 1px solid var(--slate-border); border-radius: var(--radius-md); padding: 8px 4px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .date-pill.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: white; }
    .date-pill.active .day-name { color: var(--sage-soft); }
    .date-pill.active .day-num { color: white; }
    .day-name { font-size: 10px; font-weight: 700; color: var(--slate-light); }
    .day-num { font-size: 15px; font-weight: 800; color: var(--slate-dark); }
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn { background: var(--card-white); border: 1px solid var(--slate-border); color: var(--slate-medium); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: white; }
    .add-habit-card { background: var(--card-white); border: 1px solid var(--slate-border); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-card); }
    .habit-input-group { display: flex; gap: 8px; align-items: center; }
    .habit-input { flex: 1; height: 42px; padding: 0 12px; border: 1px solid var(--slate-border); border-radius: var(--radius-md); font-size: 14px; outline: none; background: var(--forest-bg); }
    .btn-add { height: 42px; padding: 0 16px; background: var(--emerald-dark); color: white; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 700; cursor: pointer; }
    .habit-list { display: flex; flex-direction: column; gap: 10px; }
    .habit-card { background: var(--card-white); border: 1.2px solid var(--slate-border); border-radius: var(--radius-lg); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-card); }
    .habit-card.completed { background: #F4FAF6; border-color: var(--sage-pastel); }
    .habit-main { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
    .habit-emoji { font-size: 20px; width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--forest-bg); display: flex; align-items: center; justify-content: center; }
    .habit-title { font-size: 14px; font-weight: 600; color: var(--slate-dark); }
    .habit-card.completed .habit-title { text-decoration: line-through; color: var(--slate-light); }
    .habit-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .habit-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(27, 67, 50, 0.08); color: var(--emerald-dark); }
    .habit-streak { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(255, 107, 53, 0.12); color: var(--flame); }
    .btn-check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--slate-border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; }
    .habit-card.completed .btn-check { background: var(--emerald-dark); border-color: var(--emerald-dark); color: var(--sage-soft); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <div class="brand-icon">🌿</div>
        <div class="brand-title">
          <h1>HabitFlow</h1>
          <p id="current-date-label">Today's Focus</p>
        </div>
      </div>
    </header>

    <section class="progress-hero">
      <div class="progress-header">
        <div>
          <div class="progress-sub">DAILY PROGRESS</div>
          <div class="progress-status" id="progress-summary">3 of 5 habits completed - 60%</div>
        </div>
        <div style="font-size: 24px;">🌿</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar" style="width: 60%;"></div>
      </div>
      <div class="progress-footer">
        <span>Find your daily rhythm.</span>
        <span id="progress-percentage" style="font-weight: 700;">60%</span>
      </div>
    </section>

    <div class="date-strip" id="date-strip"></div>
    <div class="filter-tabs" id="filter-tabs">
      <button class="tab-btn active" data-cat="All">All</button>
      <button class="tab-btn" data-cat="Health">💧 Health</button>
      <button class="tab-btn" data-cat="Productivity">⚡ Productivity</button>
      <button class="tab-btn" data-cat="Mindset">🧘 Mindset</button>
      <button class="tab-btn" data-cat="Fitness">🏃 Fitness</button>
    </div>

    <div class="add-habit-card">
      <div class="habit-input-group">
        <input type="text" id="habit-title-input" class="habit-input" placeholder="Add daily habit..." />
        <button id="btn-add-habit" class="btn-add">+ Add Habit</button>
      </div>
    </div>

    <div class="habit-list" id="habit-list"></div>
  </div>

  <script>
    const habits = [
      { id: 1, title: 'Morning Hydration (1L)', category: 'Health', emoji: '💧', done: true, streak: 5 },
      { id: 2, title: '45 Min Deep Focus', category: 'Productivity', emoji: '⚡', done: true, streak: 3 },
      { id: 3, title: '10 Min Meditation', category: 'Mindset', emoji: '🧘', done: true, streak: 7 },
      { id: 4, title: '30 Min Brisk Nature Walk', category: 'Fitness', emoji: '🏃', done: false, streak: 2 },
      { id: 5, title: 'Read 15 Pages', category: 'Learning', emoji: '📚', done: false, streak: 4 }
    ];

    function render() {
      const list = document.getElementById('habit-list');
      list.innerHTML = '';
      let doneCount = 0;
      habits.forEach(h => {
        if (h.done) doneCount++;
        const card = document.createElement('div');
        card.className = 'habit-card ' + (h.done ? 'completed' : '');
        card.innerHTML = `
          <div class="habit-main">
            <div class="habit-emoji">${h.emoji}</div>
            <div>
              <div class="habit-title">${h.title}</div>
              <div class="habit-meta">
                <span class="habit-tag">${h.category}</span>
                <span class="habit-streak">🔥 ${h.streak}d streak</span>
              </div>
            </div>
          </div>
          <button class="btn-check">${h.done ? '✓' : ''}</button>
        `;
        card.addEventListener('click', () => {
          h.done = !h.done;
          if (h.done) h.streak++;
          else h.streak = Math.max(0, h.streak - 1);
          render();
        });
        list.appendChild(card);
      });
      const pct = Math.round((doneCount / habits.length) * 100);
      document.getElementById('progress-summary').textContent = `${doneCount} of ${habits.length} habits completed - ${pct}%`;
      document.getElementById('progress-percentage').textContent = `${pct}%`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    document.getElementById('btn-add-habit').addEventListener('click', () => {
      const input = document.getElementById('habit-title-input');
      if (input.value.trim()) {
        habits.push({ id: Date.now(), title: input.value.trim(), category: 'Health', emoji: '🌿', done: false, streak: 0 });
        input.value = '';
        render();
      }
    });

    render();
  </script>
</body>
</html>
